name: Database Ping
on:
  schedule:
    - cron: "0 0,6,12,18 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  db-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install DB Drivers
        run: npm install redis mongodb

      - name: Execute Write/Read Commands to Keep Active
        env:
          REDIS_CLOUD_URL: ${{ secrets.REDIS_CLOUD_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          node -e "
          const { createClient } = require('redis');
          const { MongoClient } = require('mongodb');

          async function keepRedisAlive() {
            if (!process.env.REDIS_CLOUD_URL) return console.log('REDIS_CLOUD_URL tidak ditemukan.');
            
            const redisClient = createClient({ url: process.env.REDIS_CLOUD_URL });
            
            try {
              await redisClient.connect();
              console.log('Terhubung ke Redis Cloud...');
              
              await redisClient.set('keepalive_status', 'active_via_github_actions');
              const value = await redisClient.get('keepalive_status');
              
              console.log('Redis Cloud Terdeteksi Aktif! Respon data:', value);
            } catch (err) {
              console.error('Gagal berinteraksi dengan Redis Cloud:', err.message);
            } finally {
              await redisClient.disconnect();
            }
          }

          async function keepMongoAlive() {
            if (!process.env.MONGODB_URI) return console.log('Secret MONGODB_URI tidak ditemukan.');
            const mongoClient = new MongoClient(process.env.MONGODB_URI);
            try {
              await mongoClient.connect();
              await mongoClient.db('admin').command({ ping: 1 });
              console.log('MongoDB Atlas berhasil diketuk!');
            } catch (err) {
              console.error('Gagal mengetuk MongoDB:', err.message);
            } finally {
              await mongoClient.close();
            }
          }

          async function main() {
            await keepRedisAlive();
            await keepMongoAlive();
          }
          main();
          "
